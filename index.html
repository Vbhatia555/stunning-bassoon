function navigate(p){page=p;render();window.scrollTo(0,0)}
function selectLevel(n){level=n;render()}
function levelBar(){return '<div class="levels" aria-label="HSK">'+[1,2,3].map(n=>'<button aria-pressed="'+(n===level)+'" onclick="selectLevel('+n+')">HSK '+n+'</button>').join('')+'</div>'}
function meter(a,b){return '<progress value="'+a+'" max="'+b+'">'+a+' / '+b+'</progress>'}
function section(title,other=''){return '<div class="section"><h2>'+title+'</h2>'+other+'</div>'}
function render(){
 document.documentElement.lang=vi?'vi':'en';$('close').ariaLabel=t('Close','Đóng');
 $('nav').innerHTML=[['learn',t('Study room','Góc học')],['bank',t('Word bank','Từ vựng')],['tests',t('Tests','Kiểm tra')],['report',t('Progress','Tiến độ')]].map(([p,n])=>'<button '+(page===p?'aria-current="page"':'')+' onclick="navigate(\''+p+'\')">'+n+'</button>').join('');
 $('lang').textContent=t('Tiếng Việt','English');$('profile').textContent=learner();$('profile').title=t('Switch learner','Đổi người học');
 if(page==='learn')home();else if(page==='report')reportPage();else if(page==='tests')testsPage();else bank();
}

function bank(){
 $('app').innerHTML=section(t('Word bank','Sổ từ vựng'),levelBar())+'<input id="search" type="search"><div id="rows"></div>';$('search').placeholder=t('Search characters, pinyin or meaning','Tìm chữ Hán, phiên âm hoặc nghĩa');$('search').ariaLabel=$('search').placeholder;$('search').oninput=filterWords;filterWords()
}
function fold(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('đ','d')}
function filterWords(){const q=fold($('search').value);$('rows').innerHTML=subset().flatMap(u=>u.words).filter(w=>w.some(v=>fold(v).includes(q))).map(w=>'<div class="row"><b lang="zh">'+w[0]+'</b><span>'+w[1]+'</span><span>'+meaning(w)+'</span>'+button(t('◖ Listen','◖ Nghe'),'speak(words['+words.indexOf(w)+'][0])','ghost')+'</div>').join('')||t('No matching words.','Không tìm thấy từ.')}
function profileDialog(){openDialog(t('Study profiles','Hồ sơ học tập'),'<p>'+t('Choose a profile on this device.','Chọn hồ sơ trên thiết bị này.')+'</p><div class="levels">'+[0,1].map(n=>{let p=read('garden-study-v2-'+n,{});return '<button aria-pressed="'+(person===n)+'" onclick="switchPerson('+n+')">'+esc(p.name||t('Learner ','Người học ')+(n+1))+'</button>'}).join('')+'</div><label for="nickname">'+t('Name for this profile','Tên hồ sơ')+'</label><input id="nickname" maxlength="32" value="'+esc(report.name)+'"><div class="actions">'+button(t('Save','Lưu'),'renameProfile()','primary')+'</div>')}
function switchPerson(n){person=n;write('garden-person',n);report=getReport();render();profileDialog()}
function renameProfile(){report.name=$('nickname').value.trim();save();modal.close();render()}
function testsPage(){
 $('app').innerHTML=section(t('Test studio','Phòng kiểm tra'))+'<p>'+t('Each level test has 12 questions. Read Chinese, translate a meaning into Mandarin, and check your answers.','Mỗi bài kiểm tra gồm 12 câu. Đọc chữ Hán, dịch sang tiếng Trung và kiểm tra đáp án.')+'</p><div class="testGrid">'+[1,2,3].map((n,i)=>'<article class="exam tone'+i+'"><div class="examArt"><b>HSK '+n+'</b></div><h3>'+t(['Foundations','Everyday Mandarin','Connected conversations'][i],['Nền tảng','Tiếng Trung hằng ngày','Hội thoại mở rộng'][i])+'</h3><p>'+t('12 questions · With speaking option','12 câu · Có thể trả lời bằng giọng nói')+'</p>'+button(t('Start test','Bắt đầu'),'levelTest('+n+')','primary')+'</article>').join('')+'</div>'
}
function reportPage(){
 let attempts=report.history, total=attempts.reduce((s,a)=>s+a.total,0),right=attempts.reduce((s,a)=>s+a.score,0);
 $('app').innerHTML=section(t('Your progress','Báo cáo tiến độ'))+'<p>'+esc(learner())+' · '+t('Saved in this browser','Lưu trên trình duyệt này')+'</p><div class="stats">'+[[report.done.length,t('Lessons complete','Bài hoàn thành')],[total?Math.round(right/total*100)+'%':'—',t('Test accuracy','Tỷ lệ đúng')],[streak(),t('Day streak','Ngày liên tiếp')],[report.spoken,t('Speaking attempts','Lượt luyện nói')]].map(([v,l])=>'<div><strong>'+v+'</strong><span>'+l+'</span></div>').join('')+'</div>'+section(t('Course completion','Tiến độ khóa học'))+[1,2,3].map(n=>{let l=catalog.filter(u=>u.level===n),c=l.filter(u=>report.done.includes(unitId(u))).length;return '<div class="progressRow"><b>HSK '+n+'</b>'+meter(c,l.length)+'<span>'+c+' / '+l.length+'</span></div>'}).join('')+section(t('Test history','Lịch sử kiểm tra'))+(attempts.length?attempts.slice().reverse().map(a=>'<div class="row"><b>HSK '+a.level+'</b><span>'+(a.unit===null?t('Level test','Kiểm tra cấp độ'):label(catalog[a.unit]))+'</span><strong>'+a.score+'/'+a.total+'</strong><small>'+new Date(a.at).toLocaleDateString(vi?'vi-VN':'en-GB')+'</small></div>').join(''):'<p>'+t('Finish a lesson quiz or level test to see your first result.','Hoàn thành bài kiểm tra để xem kết quả đầu tiên.')+'</p>')
}
function lesson(id){unit=id;card=Math.min(report.last[id]||0,catalog[id].words.length-1);showWord()}
function showWord(){
 const u=catalog[unit],w=u.words[card];stage='word';report.last[unit]=card;save(true);
 openDialog(label(u),'<small>HSK '+u.level+' · '+t('Word','Từ')+' '+(card+1)+' / '+u.words.length+'</small>'+meter(card+1,u.words.length)+wordCard(w)+voicePanel()+ '<div class="actions">'+(card?button(t('Back','Quay lại'),'card--;showWord()'):'')+(card+1<u.words.length?button(t('Next word','Từ tiếp theo'),'card++;showWord()','primary'):button(t('Conversation','Hội thoại'),'showLine(0)','primary'))+'</div>');audioTarget=w;
}
function wordCard(w){return '<div class="flash"><div lang="zh">'+w[0]+'</div><em>'+w[1]+'</em><p>'+meaning(w)+'</p></div>'}
function voicePanel(){return '<div class="actions">'+button(t('◖ Listen','◖ Nghe'),'speak(audioTarget[0])')+button(t('Slow audio','Nghe chậm'),'speak(audioTarget[0],.62)')+button(t('🎙 Repeat aloud','🎙 Đọc lại'),'practiceVoice()')+'</div><div id="voiceState" aria-live="polite"></div>'}
function showLine(n,daily=false){const u=catalog[unit],w=u.dialog[n];openDialog(daily?t('Daily speaking prompt','Luyện nói mỗi ngày'):label(u),'<small>'+t('Conversation','Hội thoại')+' · '+(n+1)+' / '+u.dialog.length+'</small>'+wordCard(w)+voicePanel()+(u.tipEn?'<p class="note">'+(vi?u.tipVi:u.tipEn)+'</p>':'')+'<div class="actions">'+(n?button(t('Previous line','Câu trước'),'showLine('+(n-1)+')'):'')+(n+1<u.dialog.length?button(t('Next line','Câu tiếp theo'),'showLine('+(n+1)+')','primary'):button(t('Lesson quiz','Kiểm tra bài học'),'beginTest(unit,catalog[unit].level)','primary'))+'</div>');audioTarget=w;save(true)}
function dailyPhrase(){const list=subset();unit=unitId(list[Math.floor(Date.now()/86400000)%list.length]);showLine(0,true)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function levelTest(n){beginTest(null,n)}
function beginTest(id,n){const pool=id===null?catalog.filter(u=>u.level===n).flatMap(u=>u.words):catalog[id].words;test={id,n,pool,items:shuffle(pool).slice(0,id===null?12:pool.length),index:0,score:0,marked:false,miss:[]};ask()}
function ask(){
 const a=test,w=a.items[a.index];a.marked=false;a.reverse=a.index%2===1;
 const opts=shuffle([w,...shuffle(a.pool.filter(v=>v[0]!==w[0]&&meaning(v)!==meaning(w))).slice(0,3)]);
 openDialog(a.id===null?'HSK '+a.n+' · '+t('Level test','Kiểm tra cấp độ'):label(catalog[a.id]),'<small>'+t('Question','Câu')+' '+(a.index+1)+' / '+a.items.length+'</small>'+meter(a.index+1,a.items.length)+'<p>'+ (a.reverse?t('How do you say this in Mandarin?','Nói từ này bằng tiếng Trung thế nào?'):t('Choose the meaning.','Chọn nghĩa đúng.'))+'</p><h3 class="prompt">'+(a.reverse?meaning(w):w[0])+'</h3>'+(a.reverse?button(t('🎙 Answer by speaking','🎙 Trả lời bằng giọng nói'),'spokenAnswer()','ghost'):button(t('◖ Listen','◖ Nghe'),'speak(test.items[test.index][0])','ghost'))+'<div id="voiceState" aria-live="polite"></div><div class="answers">'+opts.map(v=>button(a.reverse?v[0]:meaning(v),'grade('+words.indexOf(v)+')','choice')).join('')+'</div><div id="feedback" aria-live="polite"></div>')
}
function grade(id){const a=test;if(a.marked)return;a.marked=true;stopVoice();const w=a.items[a.index],ok=words[id]===w;if(ok)a.score++;else a.miss.push(w);inside.querySelectorAll('.choice').forEach(b=>b.disabled=true);$('feedback').innerHTML='<p><b>'+ (ok?t('Correct','Chính xác'):t('Correct answer','Đáp án đúng'))+'</b> · '+w[0]+' · '+meaning(w)+'</p>'+button(t('Continue','Tiếp tục'),'nextQuestion()','primary')}
function nextQuestion(){
 if(!test.marked)return;const a=test;if(++a.index<a.items.length){ask();return}
 const pass=a.score/a.items.length>=.8;if(pass&&a.id!==null&&!report.done.includes(a.id))report.done.push(a.id);if(pass&&a.id!==null)delete report.last[a.id];
 report.history.push({unit:a.id,level:a.n,at:Date.now(),score:a.score,total:a.items.length});save(true);render();
 openDialog(t('Your test results','Kết quả kiểm tra'),'<div class="score">'+a.score+' / '+a.items.length+'</div><p>'+ (pass?t('Passed. Your result is saved.','Đạt. Đã lưu kết quả.'):t('Your result is saved. Aim for 80% on your next attempt.','Đã lưu kết quả. Hãy thử đạt 80% ở lần tới.'))+'</p>'+a.miss.map(w=>'<div class="row"><b>'+w[0]+'</b><span>'+w[1]+' · '+meaning(w)+'</span></div>').join('')+'<div class="actions">'+button(t('See progress','Xem tiến độ'),"modal.close();navigate('report')",'primary')+'</div>')
}
$('profile').onclick=profileDialog;$('lang').onclick=()=>{vi=!vi;localStorage.lang=vi?'vi':'en';render()};$('close').onclick=()=>modal.close();modal.onclose=()=>stopVoice();
</script><script>'use strict';
let recognition=null,recorder=null,stream=null,clip='',voiceEpoch=0,recordTimer,utterance=null;
function stopVoice(){
 voiceEpoch++;if(recognition){recognition.onresult=null;recognition.onerror=null;recognition.onend=null;try{recognition.abort()}catch{}recognition=null}
 if(recorder&&recorder.state==='recording'){recorder.onstop=null;recorder.stop()}recorder=null;
 clearTimeout(recordTimer);if(stream)stream.getTracks().forEach(track=>track.stop());stream=null;
 if(clip){URL.revokeObjectURL(clip);clip=''}window.speechSynthesis?.cancel();utterance=null
}
function soundMessage(message){if(modal.open&&$('voiceState'))voiceStatus(message);else notify(message)}
function speak(text,rate=.86){stopVoice();voiceStatus('');const s=window.speechSynthesis;if(!s){soundMessage(t('Speech playback is unavailable in this browser.','Trình duyệt này không hỗ trợ phát âm.'));return}
 utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-CN';utterance.rate=rate;
 const voices=s.getVoices(),v=voices.find(v=>/^(cmn|zh[-_](CN|Hans|SG))/i.test(v.lang))||voices.find(v=>v.lang.startsWith('zh')&&!/HK|yue/i.test(v.lang));if(v)utterance.voice=v;
 utterance.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))soundMessage(t('Enable a Mandarin speech voice on this device and try again.','Hãy bật giọng đọc tiếng Trung trên thiết bị rồi thử lại.'))};s.speak(utterance)
}
function norm(s){return s.normalize('NFKC').replace(/[\p{P}\p{Z}\s]/gu,'').replace(/妳/g,'你')}
function voiceStatus(msg){const node=$('voiceState');if(node)node.textContent=msg}
function fallbackVoice(isTest,message){const el=$('voiceState');if(!el)return;el.textContent=message;if(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder)el.insertAdjacentHTML('beforeend','<div>'+button(t('Record and listen back','Ghi âm và nghe lại'),'recordVoice()','ghost')+'</div>');if(isTest)el.insertAdjacentHTML('beforeend','<small>'+t('Select your answer below to score it.','Chọn đáp án bên dưới để chấm điểm.')+'</small>')}
function practiceVoice(){recognize(false)}
function spokenAnswer(){if(!test.marked)recognize(true)}
function recognize(isTest){
 stopVoice();const epoch=voiceEpoch,expected=isTest?test.items[test.index]:audioTarget;const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){fallbackVoice(isTest,t('Automatic transcription is unavailable here.','Trình duyệt này không hỗ trợ nhận dạng giọng nói.'));return}
 const r=recognition=new R();r.lang='zh-CN';r.interimResults=false;r.maxAlternatives=3;
 let heard=false;
 r.onresult=e=>{if(epoch!==voiceEpoch)return;heard=true;const variants=Array.from(e.results[0],v=>v.transcript), match=variants.some(s=>norm(s)===norm(expected[0]));report.spoken++;save(true);
 const message=t('Heard','Đã nghe')+' “'+variants[0]+'”';
 if(isTest){grade(match?words.indexOf(expected):-1);voiceStatus(message)}else voiceStatus(message+' · '+(match?t('Matched the sentence.','Khớp với câu mẫu.'):t('Listen to the model and try again.','Nghe câu mẫu rồi thử lại.')))};
 r.onerror=e=>{if(epoch!==voiceEpoch)return;heard=true;fallbackVoice(isTest,e.error==='not-allowed'?t('Microphone permission is needed. Allow it in site settings to retry.','Cần quyền micrô. Hãy cho phép trong cài đặt trang web rồi thử lại.'):t('No usable transcript. Try again or record yourself.','Chưa nhận dạng được. Hãy thử lại hoặc ghi âm.'))};
 r.onend=()=>{if(epoch===voiceEpoch&&!heard)fallbackVoice(isTest,t('No speech detected.','Chưa nghe thấy giọng nói.'))};
 try{r.start();voiceStatus(t('Listening… speak in Mandarin.','Đang nghe… hãy nói tiếng Trung.'))}catch{fallbackVoice(isTest,t('Speech recognition could not start.','Không thể bắt đầu nhận dạng giọng nói.'))}
}
async function recordVoice(){
 stopVoice();const epoch=voiceEpoch;
 try{let mic=await navigator.mediaDevices.getUserMedia({audio:true});if(epoch!==voiceEpoch||!modal.open){mic.getTracks().forEach(t=>t.stop());return}
 stream=mic;const rec=recorder=new MediaRecorder(mic),parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
 rec.onstop=()=>{mic.getTracks().forEach(t=>t.stop());clearTimeout(recordTimer);if(epoch!==voiceEpoch)return;report.spoken++;save(true);clip=URL.createObjectURL(new Blob(parts,{type:rec.mimeType}));const el=$('voiceState');el.textContent=t('Your recording','Bản ghi âm của bạn');let audio=document.createElement('audio');audio.controls=true;audio.src=clip;el.append(audio)};
 rec.start();$('voiceState').innerHTML=button(t('Stop recording','Dừng ghi âm'),'finishRecording()','primary');recordTimer=setTimeout(finishRecording,20000)
 }catch{stopVoice();voiceStatus(t('Microphone unavailable. Check your browser’s microphone permission.','Không dùng được micrô. Hãy kiểm tra quyền micrô của trình duyệt.'))}
}
function finishRecording(){if(recorder?.state==='recording')recorder.stop()}
window.speechSynthesis?.getVoices();render();
</script></body></html>
